name: Scan sites

# Rebuilds web/public/data/<region>/ from the latest OpenStreetMap extract.
on:
  schedule:
    - cron: '17 18 * * 0' # Mondays 03:17 JST
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    env:
      REGION: japan
      EXTRACT_URL: https://download.geofabrik.de/asia/japan-latest.osm.pbf
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install osmium
        run: sudo apt-get update -q && sudo apt-get install -y -q osmium-tool
      - name: Download OpenStreetMap extract
        run: curl -fsSL --retry 3 -o region.osm.pbf "$EXTRACT_URL" && ls -lh region.osm.pbf
      - name: Filter grid and land features
        run: |
          osmium tags-filter region.osm.pbf \
            nwr/power=substation w/power=line wr/landuse=industrial,brownfield,greenfield \
            -o filtered.osm.pbf --overwrite
          osmium export filtered.osm.pbf -f geojsonseq -u type_id -o features.geojsonseq --overwrite
          ls -lh filtered.osm.pbf features.geojsonseq
      - name: Test scanner
        run: npm test
        working-directory: pipeline
      - name: Analyse sites
        run: node pipeline/scan.mjs features.geojsonseq "web/public/data/$REGION" "$REGION" && ls -lh "web/public/data/$REGION"
      - name: Commit data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "web/public/data/$REGION"
          if git diff --cached --quiet; then echo "No changes"; exit 0; fi
          git commit -m "Scan $REGION sites $(date -u +%Y-%m-%d)"
          git push
